[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lncur"
version = "1.2.0"
description = "CLI tool to automate symlinking files when porting Windows cursors to Linux"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "claymorwan", email = "claymorwan@deadf.org" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.13"
dependencies = []

[project.urls]
Repository = "https://codeberg.org/claymorwan/lncur"
Issues = "https://codeberg.org/claymorwan/lncur/issues"
# changelog = "https://codeberg.org/claymorwan/lncur/blob/main/CHANGELOG.md"

[project.scripts]
lncur = "lncur:main"
